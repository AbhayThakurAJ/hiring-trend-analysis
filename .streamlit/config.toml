# Streamlit Configuration & Custom Theme for Hiring Trend Analysis
[theme]
primaryColor       = "#2E74B5"
backgroundColor    = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor          = "#0F172A"
font               = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[browser]
gatherUsageStats = false
